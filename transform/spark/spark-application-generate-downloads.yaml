# Cerberus 17.2 -- the bulk downloads generator (ADR 0030 Decisions 7 and 10),
# submitted by the 17.5 launch_exercise.sh during a dev-compute exercise. Not
# part of the state machine, and not Terraform-managed, for the same reason as
# spark-application-generate.yaml: a job run, not standing infrastructure.
#
# Same image, hadoop-aws pairing, service account and metrics config as
# spark-application-generate.yaml (and spark-application.yaml, which says how
# the versions were verified). Differences:
#   - __RUN_ID__/__EVENTS__/__NOW__/__EXECUTORS__/__CONGESTION__/__OUTPUT__/
#     __SILVER_BUCKET__ are substituted by launch_exercise.sh (17.5) before
#     `kubectl apply`. __OUTPUT__ is s3a://<bronze>/downloads_bulk/.
#   - the Python workers run the generator core, so each executor has
#     memoryOverhead 1g (unverified: measure on the Friday smoke run).
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: cerberus-generate-bulk-downloads
  namespace: spark-jobs
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: "apache/spark:3.5.9"
  imagePullPolicy: IfNotPresent
  sparkVersion: "3.5.9"
  # Uploaded by launch_exercise.sh to the same _spark_jobs/ prefix as the
  # transform script (silver, which cerberus-spark can already read).
  mainApplicationFile: "s3a://__SILVER_BUCKET__/_spark_jobs/generate_bulk_downloads.py"
  arguments:
    - "--run-id"
    - "__RUN_ID__"
    - "--events"
    - "__EVENTS__"
    - "--now"
    - "__NOW__"
    - "--congestion"
    - "__CONGESTION__"
    - "--output"
    - "__OUTPUT__"
  restartPolicy:
    type: Never
  deps:
    packages:
      - org.apache.hadoop:hadoop-aws:3.3.4
  sparkConf:
    spark.hadoop.fs.s3a.aws.credentials.provider: "com.amazonaws.auth.WebIdentityTokenCredentialsProvider"
    # See spark-application.yaml: the operator pod's $HOME is not writable.
    spark.jars.ivy: "/tmp/.ivy2"
    # 7.7 (ADR 0016) metrics, unchanged, so the run shows on the Spark
    # dashboard under spark_app="cerberus-generate-bulk-downloads".
    spark.ui.prometheus.enabled: "true"
    spark.metrics.conf.*.sink.prometheusServlet.class: "org.apache.spark.metrics.sink.PrometheusServlet"
    spark.metrics.conf.*.sink.prometheusServlet.path: "/metrics/prometheus"
    spark.metrics.conf.driver.source.jvm.class: "org.apache.spark.metrics.source.JvmSource"
    spark.metrics.namespace: "cerberus"
  driver:
    cores: 1
    coreRequest: "500m"
    memory: "1g"
    serviceAccount: cerberus-spark
    labels:
      version: "3.5.9"
    # ADR 0020: the driver stays on On-Demand -- losing it loses the run.
    # (It can't land on the Spot nodes anyway: it doesn't tolerate their
    # taint. The selector says so explicitly.)
    nodeSelector:
      eks.amazonaws.com/capacityType: ON_DEMAND
  executor:
    cores: 1
    coreRequest: "800m"
    instances: __EXECUTORS__
    memory: "2g"
    memoryOverhead: "1g"
    labels:
      version: "3.5.9"
    # ADR 0020: executors run on the Spot executor nodes, and only there.
    nodeSelector:
      eks.amazonaws.com/capacityType: SPOT
    tolerations:
      - key: cerberus/spot
        operator: Exists
        effect: NoSchedule
