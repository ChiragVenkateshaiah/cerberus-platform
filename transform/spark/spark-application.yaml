# Cerberus 3.5 -- submitted manually via submit_job.sh, not Terraform-managed
# (see terraform/modules/spark_job/main.tf's header for why: this represents
# a job *run*, not standing infrastructure).
#
# image/sparkVersion: apache/spark:3.5.9 verified live against Docker Hub's
# tags API on 2026-08-18 (paging to the last page -- the API's `ordering`
# param is silently ignored on this endpoint, which is what made earlier
# lookups look stale). 3.5.9 is the latest patch on the 3.5.x line this
# manifest already targeted. hadoop-aws's version below is paired by reading
# v3.5.9's own pom.xml (<hadoop.version>3.3.4</hadoop.version>) rather than
# guessed -- a mismatch here is a classic, hard-to-debug
# ClassNotFoundException at runtime, not a startup-time config error.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: cerberus-promote-payments
  namespace: spark-jobs
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: "apache/spark:3.5.9"
  imagePullPolicy: IfNotPresent
  sparkVersion: "3.5.9"
  # Uploaded here by submit_job.sh, not baked into the image -- silver is
  # the bucket this job already writes its actual output to and cerberus-spark
  # already has read/write there, so no new bucket or IAM grant is needed
  # just to host one script. The leading underscore keeps it out of the
  # payments/dt=.../ partitions Athena/Glue actually scan.
  mainApplicationFile: "s3a://cerberus-platform-silver-131715059025/_spark_jobs/promote_payments_spark.py"
  restartPolicy:
    type: Never
  deps:
    # aws-java-sdk-bundle is pulled in transitively by hadoop-aws's own POM
    # at the matching version -- not pinned separately here to avoid hand-
    # picking a pair that doesn't actually match.
    packages:
      - org.apache.hadoop:hadoop-aws:3.3.4
  sparkConf:
    spark.hadoop.fs.s3a.aws.credentials.provider: "com.amazonaws.auth.WebIdentityTokenCredentialsProvider"
    # The Spark Operator's controller resolves `deps.packages` locally via
    # Ivy *inside its own pod* before ever creating a driver -- and that
    # pod's $HOME is /nonexistent (a hardened non-root container), so Ivy's
    # default $HOME/.ivy2 cache path fails outright. Point it at /tmp
    # instead, which is writable in any container. Discovered live: the
    # first submission attempt failed with a FileNotFoundException under
    # /nonexistent/.ivy2.5.2/cache before a driver pod was ever scheduled.
    spark.jars.ivy: "/tmp/.ivy2"
  driver:
    cores: 1
    memory: "1g"
    serviceAccount: cerberus-spark
    labels:
      version: "3.5.9"
  executor:
    cores: 1
    instances: 1
    memory: "1g"
    labels:
      version: "3.5.9"
