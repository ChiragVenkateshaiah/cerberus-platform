name: 'cerberus_platform'
version: '1.0.0'
config-version: 2

profile: 'cerberus_platform'

model-paths: ["models"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Full rebuild every run, same "simplest correct option at this data
# volume" call 1.7's Python transform made -- no incremental logic.
models:
  cerberus_platform:
    marts:
      +materialized: table
      # 8.5 (ADR 0017): gold is Apache Iceberg in the Glue catalog, like
      # silver. schema_table_unique gives each build its own prefix,
      # s3://<gold>/cerberus_platform/<table>/<uuid>/, which dbt-athena needs
      # to swap Iceberg tables safely on a rebuild. Not table_unique: that
      # nests the new table under the old Hive table's location
      # (s3://<gold>/<table>/), and dropping the Hive table deletes that whole
      # prefix -- new metadata included (ICEBERG_MISSING_METADATA, 2026-10-08).
      +table_type: iceberg
      +s3_data_naming: schema_table_unique
      downloads:
        +enabled: "{{ var('enable_downloads', false) }}"
        fct_cdn_requests:
          +enabled: "{{ var('enable_downloads', false) and var('enable_downloads_cdn', false) }}"
        fct_cdn_run:
          +enabled: "{{ var('enable_downloads', false) and var('enable_downloads_cdn', false) }}"

# 17.5 (ADR 0030 Decision 11): the downloads marts and sources are off unless a
# `launch-exercise` run turns them on with --vars. The scheduled `dbt-ol build`
# never sets these, so it builds no downloads model and runs no downloads source
# test. (17.5a gives the Fargate dbt role the reads; it does not use them yet.)
# `enable_downloads_cdn` also needs `enable_downloads`.
# `release_utc` is the generator's RELEASE_UTC_MS (a test compares them).
vars:
  enable_downloads: false
  enable_downloads_cdn: false
  release_utc: "2026-11-19 00:00:00"

sources:
  cerberus_platform:
    cerberus_downloads:
      download_events:
        +enabled: "{{ var('enable_downloads', false) }}"
      bronze_downloads_cdn:
        +enabled: "{{ var('enable_downloads', false) and var('enable_downloads_cdn', false) }}"
