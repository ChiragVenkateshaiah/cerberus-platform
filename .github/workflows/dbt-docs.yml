name: dbt docs (lineage)

# 6.4a/6.4d. Builds the lineage section of the GitHub Pages site:
#   /dbt/     -- dbt's model-level DAG, generated offline from manifest.json
#   /lineage/ -- the runtime graph, rendered from the OpenLineage events the
#                6.4b collector captured in S3 (6.4d)
#   /         -- the landing page (docs/pages/index.html)
#
# The dbt-docs half runs fully offline (`dbt parse` + `dbt docs generate
# --empty-catalog --no-compile` never open a warehouse connection -- same
# basis as code-ci.yml's `dbt parse`). The runtime-graph half needs to read
# the lineage bucket, so on a push or a manual dispatch it assumes
# cerberus-ci-plan (read-only OIDC, the same role terraform-plan.yml uses)
# and `aws s3 sync`s the events.
#
# On a PR: builds only, no AWS access -- the renderer is smoke-tested
# against the committed sample events. On merge to main, or a manual
# workflow_dispatch (e.g. to pick up new Spark events after a compute
# exercise): also fetches the real events and deploys to Pages.

on:
  pull_request:
    paths:
      - "transform/dbt/**"
      - "lineage/**"
      - "docs/pages/**"
      - ".github/workflows/dbt-docs.yml"
  push:
    branches: [main]
    paths:
      - "transform/dbt/**"
      - "lineage/**"
      - "docs/pages/**"
      - ".github/workflows/dbt-docs.yml"
  # Manual re-render: the /lineage/ page's content depends on the
  # OpenLineage events in S3, not just on code -- so after a compute
  # exercise adds Spark events (or any pipeline run adds dbt events), a
  # dispatch rebuilds and redeploys the site with no code change needed.
  workflow_dispatch:

permissions:
  contents: read

# One in-flight run per ref; a newer push supersedes an older build.
concurrency:
  group: dbt-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # only used on push, to assume cerberus-ci-plan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        working-directory: transform/dbt
        run: pip install --quiet -r requirements.txt

      # manifest.json (the DAG the docs site renders as lineage) is written
      # by `dbt parse`; `dbt docs generate` on its own with --no-compile
      # does not write it. --empty-catalog skips the information_schema
      # query, --no-compile skips relation introspection -- together they
      # keep both commands connection-free against the placeholder
      # ci_profiles profile.
      - name: Generate dbt docs
        working-directory: transform/dbt
        env:
          DBT_PROFILES_DIR: ci_profiles
        run: |
          dbt parse --no-partial-parse
          dbt docs generate --empty-catalog --no-compile --no-partial-parse

      - name: Assemble Pages site
        run: |
          mkdir -p site/dbt
          cp docs/pages/index.html site/index.html
          cp transform/dbt/target/index.html site/dbt/index.html
          cp transform/dbt/target/manifest.json site/dbt/manifest.json
          cp transform/dbt/target/catalog.json site/dbt/catalog.json

      # --- runtime lineage graph (6.4d) ---------------------------------

      - name: Fetch captured lineage events
        if: github.event_name != 'pull_request'
        id: fetch
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync events from S3
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p lineage-events
          aws s3 sync s3://cerberus-platform-lineage-131715059025/events/ lineage-events/ \
            --no-progress --only-show-errors

      # On push: render from the real events synced above. On PR: render
      # from the committed samples, purely to catch a renderer regression
      # before merge (the output is not uploaded).
      - name: Render runtime lineage graph
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            python lineage/render/render_graph.py --events-dir lineage-events --out site/lineage/index.html
          else
            python lineage/render/render_graph.py --events-dir lineage/render/sample --out /tmp/lineage-smoke.html
          fi

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
