name: terraform apply (dev-standing)

# ADR 0011 (5.2). Runs only on push to main -- i.e. only after a PR has
# actually been merged (or a direct push, for the routine checkpoint-only
# commits this project's workflow already allows straight to main).
#
# cerberus-ci-apply's trust policy (terraform/modules/github_oidc) only
# matches an OIDC token whose `sub` claim is exactly
# repo:<owner>/<repo>:ref:refs/heads/main -- a token minted for a PR run,
# or for any other branch, is rejected before this job could ever assume
# write credentials, independent of this file's own `on:` trigger.
#
# Its ARN is a Secret, not a Variable, unlike the plan role's -- this job
# never runs for a fork (push to main is unreachable from a fork), so
# Secrets' fork-PR redaction has no functional cost here, only the benefit
# of not putting the account ID in plaintext logs/settings.
on:
  push:
    branches: [main]
    paths:
      - "terraform/modules/**"
      - "terraform/envs/dev-standing/**"
      - ".github/workflows/terraform-apply.yml"

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/envs/dev-standing
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_APPLY_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3

      - name: terraform init
        run: terraform init

      - name: terraform apply
        run: terraform apply -auto-approve -input=false
