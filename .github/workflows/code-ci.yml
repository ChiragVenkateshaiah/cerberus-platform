name: code CI (lint/dbt validate)

# 5.3. Runs on every PR touching the ingestion/transform Python or the dbt
# project -- deliberately separate from terraform-plan.yml/terraform-apply.yml,
# which are path-filtered to terraform/** only and would never trigger for
# these paths. No AWS access at all: neither job needs it (see dbt-validate
# below for why `dbt parse` doesn't either), so there's no OIDC role to
# request and no `id-token: write` permission to grant.
on:
  pull_request:
    paths:
      - "ingestion/**"
      - "transform/**"
      - "observability/**"
      - "lineage/**"
      - "console/**"
      - "Phases.md"
      - "terraform/modules/console_roles/variables.tf"
      - "terraform/modules/console_edge/main.tf"
      - "terraform/modules/console_edge/variables.tf"
      - "docs/adr/0024-demo-console.md"
      - "pyproject.toml"
      - "requirements-dev.txt"
      - ".github/workflows/code-ci.yml"

permissions:
  contents: read

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install --quiet -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  # 6c (ADR 0022 amendment): the Spark progress exporter, tested against the
  # fixtures captured from a real local Spark run (observability/spark_progress).
  # The exporter itself is stdlib only and runs on the Spark image's Python 3.10;
  # CI uses 3.10 to match the image. No AWS access.
  exporter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dev requirements
        run: pip install --quiet -r requirements-dev.txt

      - name: pytest
        run: pytest observability/spark_progress

  # 9.2 step 10 (ADR 0024): the console Grafana module (run records to
  # annotations, dashboard transform, loopback loader, grafana.ini template).
  # The console host runs it with AL2023's system python3, which is 3.9, so CI
  # uses 3.9. It replaces the observability/grafana half of exporter-tests, so
  # these tests run once, on the older interpreter. Pytest 9 needs Python 3.10
  # or newer (from memory, unverified), so this job installs pytest 8 instead of
  # requirements-dev.txt. No AWS and no network.
  grafana-console-tests:
    # Pinned: setup-python has no 3.9 build for ubuntu-latest (26.04) since
    # 2026-11-13. 3.9 matches python3 on the AL2023 session host.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install pytest
        run: pip install --quiet "pytest>=8.4,<9"

      - name: pytest
        run: pytest observability/grafana/console

  # 9.3 (ADR 0024): the read-only console command set. Pure Python plus pytest;
  # the tests use fake AWS clients, so there is no boto3, no AWS and no network.
  console-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev requirements
        run: pip install --quiet -r requirements-dev.txt

      - name: pytest
        run: pytest console

      # 9.5 (ADR 0024 amendment, 2026-11-12): the terminal's script is plain
      # JavaScript with no toolchain. Uses the runner's own Node; no setup-node, no npm.
      - name: terminal.js syntax and unit tests
        run: node --check console/cerberus_terminal/static/terminal.js && node --test console/tests/js/*.test.js

  dbt-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transform/dbt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt + sqlfluff
        run: |
          pip install --quiet -r requirements.txt
          pip install --quiet -r ../../requirements-dev.txt

      # `dbt parse` only builds the manifest (resolves refs/sources, renders
      # Jinja) -- it never opens a warehouse connection, so it runs clean
      # against a profile with no real AWS profile/credentials behind it
      # (ci_profiles/, committed alongside the real ../profiles.yml).
      # Confirmed live: sqlfluff's own dbt templater, by contrast, DOES open
      # a connection (calls sts:GetCallerIdentity to build a relation
      # cache) even just to lint -- which is why .sqlfluff below uses the
      # plain `jinja` templater instead, not `dbt`.
      - name: dbt parse
        env:
          DBT_PROFILES_DIR: ci_profiles
        run: dbt parse --no-partial-parse

      - name: sqlfluff lint
        run: sqlfluff lint models/
