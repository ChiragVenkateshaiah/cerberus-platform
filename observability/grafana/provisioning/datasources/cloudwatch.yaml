# Fixed uid: the dashboards reference it. Credentials come from the
# environment, set by `make grafana-up`
# (short-lived cerberus-grafana-read session). The console session does not
# mount this file (ADR 0024).
apiVersion: 1
datasources:
  - name: CloudWatch
    uid: cloudwatch
    type: cloudwatch
    access: proxy
    jsonData:
      authType: default
      defaultRegion: us-east-1
