# Same uid and settings as the in-cluster datasource
# (terraform/modules/eks_observability/main.tf), so one dashboard JSON works
# in both. Credentials come from the environment, set by `make grafana-up`
# (short-lived cerberus-grafana-read session). The console session mounts
# only this file (ADR 0024).
# ${AMP_URL} is set by `make grafana-up` (the workspace's query endpoint).
apiVersion: 1
datasources:
  - name: Amazon Managed Prometheus
    uid: amp
    type: grafana-amazonprometheus-datasource
    url: ${AMP_URL}
    access: proxy
    isDefault: true
    jsonData:
      httpMethod: POST
      sigV4Auth: true
      sigV4AuthType: default
      sigV4Region: us-east-1
      sigv4Service: aps
