# Local Grafana for the Cerberus run views (ADR 0022). Start it with
# `make grafana-up` from the repo root; see README.md in this directory.
name: cerberus-grafana

services:
  grafana:
    image: grafana/grafana:13.2.3
    # Run as the host user, not the image's uid 472. The named volume starts
    # owned by uid 472, so grafana-init gives it to this uid, and the volume
    # is then owned by the host uid.
    user: "${GRAFANA_UID:-1000}:${GRAFANA_GID:-1000}"
    depends_on:
      grafana-init:
        condition: service_completed_successfully
    ports:
      # Loopback only: the short-lived read-only credentials in this
      # container must not be reachable from the network.
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:?set it in observability/grafana/.env}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Same plugin version as the in-cluster Grafana (var.amp_plugin_version).
      GF_PLUGINS_PREINSTALL_SYNC: grafana-amazonprometheus-datasource@3.2.0
      AMP_URL: "${AMP_URL:?set by make grafana-up}"
      # Short-lived cerberus-grafana-read session, set by make grafana-up.
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:?set by make grafana-up}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:?set by make grafana-up}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:?set by make grafana-up}"
      AWS_REGION: us-east-1
      # External plugins only see the host env vars listed here.
      # The core CloudWatch datasource reads the AWS_* vars without this (verified 2026-10-29).
      GF_PLUGINS_FORWARD_HOST_ENV_VARS: grafana-amazonprometheus-datasource
      HOME: /tmp
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards/cerberus:ro

  grafana-init:
    image: grafana/grafana:13.2.3
    user: root
    entrypoint: ["chown", "-R", "${GRAFANA_UID:-1000}:${GRAFANA_GID:-1000}", "/var/lib/grafana"]
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  grafana-data:
